[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antsim"
version = "1.0.0"
description = "Modele d'agents pour le trafic bidirectionnel de fourmis d'Argentine sur un pont"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.58", "matplotlib>=3.7"]

[project.optional-dependencies]
extras = ["tqdm>=4.60", "pandas>=2.0", "scipy>=1.10"]

[tool.setuptools]
packages = ["antsim", "viz"]
